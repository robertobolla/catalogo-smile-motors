<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="/favicon.png?v=1" />
  <link rel="apple-touch-icon" href="/favicon.png?v=1" />
  <meta name="theme-color" content="#0b0b0c" />

  <!-- Esto es todo lo que ven los rastreadores que NO ejecutan JavaScript
       (WhatsApp, Facebook). La app reescribe título y descripción por ruta,
       pero para esos clientes el HTML inicial es la única fuente. -->
  <title>Catálogo 2026: motos y triciclos con envío a Cuba | Smile Motors</title>
  <meta name="description"
    content="Catálogo 2026 de Smile Motors: triciclos de carga, motos eléctricas, motos de combustión y sistemas solares con precios en dólares y envío a Cuba incluido." />
  <link rel="canonical" href="https://catalogo.smilemotors.online/" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Smile Motors" />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:title" content="Catálogo 2026: motos y triciclos con envío a Cuba | Smile Motors" />
  <meta property="og:description"
    content="Triciclos de carga, motos eléctricas, motos de combustión y sistemas solares. Precios en dólares con el envío a Cuba incluido." />
  <meta property="og:url" content="https://catalogo.smilemotors.online/" />
  <meta property="og:image" content="https://catalogo.smilemotors.online/logo.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Catálogo 2026: motos y triciclos con envío a Cuba | Smile Motors" />
  <meta name="twitter:description"
    content="Triciclos de carga, motos eléctricas, motos de combustión y sistemas solares. Precios en dólares con el envío a Cuba incluido." />
  <meta name="twitter:image" content="https://catalogo.smilemotors.online/logo.png" />

  <!-- `ItemList` y no `Store`: un `Store` con `priceRange` le dice a Google que
       acá se compra, y acá no se compra ni se puede contactar a nadie. Sin
       `email` ni `telephone` por lo mismo — el schema no debe publicar un canal
       que el sitio no ofrece. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Smile Motors — Catálogo 2026",
    "description": "Catálogo de triciclos, motos eléctricas, motos de combustión y sistemas solares, con envíos a Cuba.",
    "url": "https://catalogo.smilemotors.online/",
    "inLanguage": "es"
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
